<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription DAS IA</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.form{
background:white;
padding:30px;
border-radius:10px;
width:400px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#0F4C81;
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
}

button{
width:100%;
padding:12px;
background:#16A34A;
color:white;
border:none;
cursor:pointer;
border-radius:6px;
}

#message{
margin-top:10px;
color:green;
font-weight:bold;
text-align:center;
}

</style>

</head>

<body>

<div class="form">

<h1>🤖 DAS IA</h1>

<input id="nom" type="text" placeholder="Nom complet">

<input id="telephone" type="text" placeholder="Téléphone">

<input id="email" type="email" placeholder="Email">

<input id="pays" type="text" placeholder="Pays">

<input id="ville" type="text" placeholder="Ville">

<input id="password" type="password" placeholder="Mot de passe">

<button onclick="inscription()">
Créer mon compte
</button>

<p id="message"></p>

</div>

<script>

function inscription(){

document.getElementById("message").innerHTML =
"✅ Compte DAS IA créé avec succès (version démonstration)";

}

</script>

</body>
</html>
