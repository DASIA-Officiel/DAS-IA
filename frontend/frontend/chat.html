<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat DAS IA</title>

<style>

body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f7fb;
}

header{
background:#0F4C81;
color:white;
padding:20px;
text-align:center;
}

.chat{
max-width:900px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#messages{
height:300px;
border:1px solid #ddd;
padding:10px;
overflow-y:auto;
margin-bottom:10px;
}

input{
width:75%;
padding:12px;
}

button{
padding:12px;
background:#16A34A;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<header>
<h1>🤖 DAS IA</h1>
</header>

<div class="chat">

<div id="messages">
<p><b>DAS IA :</b> Bonjour, comment puis-je vous aider ?</p>
</div>

<input
type="text"
id="question"
placeholder="Posez votre question..."
>

<button onclick="envoyer()">
Envoyer
</button>

</div>

<script>

function envoyer(){

let question =
document.getElementById("question").value;

if(question===""){
return;
}

document.getElementById("messages").innerHTML +=
"<p><b>Vous :</b> " +
question +
"</p>";

document.getElementById("question").value="";

}

</script>

</body>
</html>
